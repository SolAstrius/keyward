[package]
name = "keywardd"
version = "0.1.0"
edition = "2021"
description = "SSH agent proxy that attributes every signature to the app that asked for it"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"

[profile.release]
opt-level = 2
strip = true
